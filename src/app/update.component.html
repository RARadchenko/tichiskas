<div class="container">
    <div class="d-cont">
        <p>Login:</p>
        <input type="text" [(ngModel)]="login">
    </div>
    <div class="d-cont">
        <p>Username:</p>
        <input type="text" [(ngModel)]="username">
    </div>
    <div class="d-cont">
        <p>Email:</p>
        <input type="text" [(ngModel)]="email">
    </div>
    <div class="d-cont">
        <p>Phone:</p>
        <input type="text" [(ngModel)]="phone">
    </div>
    <p class="alert">{{alert}}</p>
    <button [routerLink]="['']">Cancel</button>
    <button (click)="continue()">Save</button>
</div>
